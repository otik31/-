<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мой склад</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f4f6;
    color: #111;
    font-family: Arial, sans-serif;
}

button,
input,
select {
    font-family: inherit;
}

.header {
    background: #111;
    color: white;
    height: 60px;
    padding: 0 15px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: sticky;
    top: 0;

    z-index: 50;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.menu-button {
    background: #333;
    color: white;
    border: 0;

    width: 42px;
    height: 42px;

    border-radius: 10px;

    font-size: 20px;
}

.container {
    max-width: 760px;
    margin: auto;
    padding: 15px;
}

.section {
    margin-bottom: 24px;
}

.section-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.metric {
    background: white;
    border-radius: 14px;

    padding: 15px;

    min-height: 110px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.05);

    cursor: pointer;
}

.metric:active {
    transform: scale(.98);
}

.metric-title {
    color: #777;
    font-size: 13px;
}

.metric-value {
    font-size: 28px;
    font-weight: bold;

    margin-top: 8px;
}

.metric-unit {
    color: #777;
    font-size: 13px;
}

.card {
    background: white;
    border-radius: 14px;

    padding: 15px;

    margin-bottom: 10px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.04);
}

.clickable {
    cursor: pointer;
}

.clickable:active {
    transform: scale(.99);
}

.warehouse-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.warehouse-name {
    font-weight: bold;
}

.product-name {
    font-size: 17px;
    font-weight: bold;
}

.product-subtitle {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    text-align: left;
    color: #777;
    font-size: 12px;
    padding: 8px 5px;
}

td {
    padding: 11px 5px;
    border-top: 1px solid #eee;
}

.link {
    color: #1266ff;
    font-weight: bold;
    cursor: pointer;
}

.total {
    margin-top: 12px;
    padding-top: 12px;

    border-top: 1px solid #eee;

    display: flex;
    justify-content: space-between;

    font-weight: bold;
}

.warning {
    background: #fff8dc;
    border: 1px solid #e8d27c;
}

.success {
    background: #e9f7ec;
    border: 1px solid #a8d5b0;
}

.add-button {
    width: 100%;

    padding: 14px;

    background: white;

    border: 2px dashed #ccc;

    border-radius: 12px;

    font-size: 15px;

    cursor: pointer;
}

.blue {
    color: #1266ff;
    font-weight: bold;
}

.danger-button {
    background: #ffe6e6;
    color: #c00000;

    border: 0;

    padding: 9px 12px;

    border-radius: 8px;

    cursor: pointer;
}

.primary-button {
    width: 100%;

    background: #111;
    color: white;

    border: 0;

    padding: 13px;

    border-radius: 9px;

    font-size: 15px;
}

.secondary-button {
    width: 100%;

    background: #eee;

    border: 0;

    padding: 13px;

    border-radius: 9px;

    font-size: 15px;
}

.back-button {
    background: #eee;

    border: 0;

    padding: 9px 12px;

    border-radius: 8px;

    margin-bottom: 12px;
}

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.5);

    z-index: 100;

    padding: 15px;
}

.modal-box {
    background: white;

    max-width: 560px;

    margin: 20px auto;

    border-radius: 16px;

    padding: 20px;

    max-height: 90vh;

    overflow-y: auto;
}

.close {
    float: right;

    font-size: 28px;

    cursor: pointer;
}

.modal-row {
    padding: 13px 5px;

    border-bottom: 1px solid #eee;

    cursor: pointer;
}

.modal-row:last-child {
    border-bottom: 0;
}

.small {
    color: #777;

    font-size: 13px;
}

.badge {
    display: inline-block;

    padding: 5px 9px;

    border-radius: 20px;

    background: #eee;

    font-size: 12px;
}

.form-label {
    display: block;

    margin-top: 12px;
    margin-bottom: 6px;

    font-size: 13px;

    color: #555;
}

input {
    width: 100%;

    padding: 12px;

    border: 1px solid #ddd;

    border-radius: 9px;

    font-size: 15px;
}

.empty {
    text-align: center;

    padding: 25px;

    color: #777;
}

.menu-section {
    margin-top: 22px;
}

.menu-section-title {
    font-weight: bold;

    margin-bottom: 8px;
}

.menu-item {
    padding: 13px 5px;

    border-bottom: 1px solid #eee;
}

.menu-item-action {
    color: #1266ff;

    font-weight: bold;

    cursor: pointer;
}

.account-line {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 9px 0;
}

</style>
</head>


<body>


<header class="header">

    <div class="logo">
        📦 Мой склад
    </div>

    <button
        class="menu-button"
        onclick="openMenu()">

        ☰

    </button>

</header>


<main
    class="container"
    id="app">

</main>


<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <span
            class="close"
            onclick="closeModal()">

            ×

        </span>

        <div id="modalContent"></div>

    </div>

</div>


<script>


/* =========================================================
   ДАННЫЕ
========================================================= */


let warehouses = [

    {
        id: 1,
        name: "Белгород"
    },

    {
        id: 2,
        name: "Москва"
    }

];


let platforms = [

    {
        id: 1,

        name: "Wildberries",

        accounts: [

            {
                id: 1,
                name: "WB Аккаунт 1"
            },

            {
                id: 2,
                name: "WB Аккаунт 2"
            }

        ]

    },

    {
        id: 2,

        name: "Ozon",

        accounts: [

            {
                id: 3,
                name: "Ozon Аккаунт 1"
            }

        ]

    }

];


let products = [

    {
        id: 1,

        name: "Товар 1",

        owner: "manufacturer",

        sizes: [

            {
                id: 1,
                size: "1",
                stock: 20
            },

            {
                id: 2,
                size: "2",
                stock: 35
            },

            {
                id: 3,
                size: "3",
                stock: 42
            },

            {
                id: 4,
                size: "4",
                stock: 18
            },

            {
                id: 5,
                size: "5",
                stock: 7
            }

        ]

    }

];


let orders = [

    {
        id: "WB-10001",
        platform: 1,
        account: 1,
        product: 1,
        size: "3",
        quantity: 5
    },

    {
        id: "WB-10002",
        platform: 1,
        account: 2,
        product: 1,
        size: "3",
        quantity: 3
    },

    {
        id: "OZ-20001",
        platform: 2,
        account: 3,
        product: 1,
        size: "3",
        quantity: 4
    },

    {
        id: "WB-10003",
        platform: 1,
        account: 1,
        product: 1,
        size: "2",
        quantity: 7
    }

];


/*
    Для прототипа считаем,
    что производителю нужно поставить
    количество, которое заказали.
*/


let supplierOrders = [

    {
        product: 1,
        size: "3",
        quantity: 15
    }

];



/* =========================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
========================================================= */


function getProduct(id) {

    return products.find(
        product => product.id === id
    );

}


function getPlatform(id) {

    return platforms.find(
        platform => platform.id === id
    );

}


function getAccount(id) {

    for (
        const platform of platforms
    ) {

        const account =
            platform.accounts.find(
                account => account.id === id
            );

        if (account) {

            return account;

        }

    }

    return null;

}


function getOrdered(productId, size) {

    return orders

        .filter(
            order =>
                order.product === productId &&
                order.size === size
        )

        .reduce(
            (sum, order) =>
                sum + order.quantity,

            0
        );

}


function getTotalStock() {

    return products.reduce(

        (sum, product) =>

            sum +

            product.sizes.reduce(

                (s, size) =>
                    s + size.stock,

                0

            ),

        0

    );

}


function getTotalOrdered() {

    return orders.reduce(

        (sum, order) =>
            sum + order.quantity,

        0

    );

}


function getAccountsWithOrders() {

    return new Set(

        orders.map(
            order => order.account
        )

    ).size;

}


function getSupplierNeed() {

    return supplierOrders.reduce(

        (sum, item) =>
            sum + item.quantity,

        0

    );

}



/* =========================================================
   ГЛАВНАЯ
========================================================= */


function renderDashboard() {

    const totalStock =
        getTotalStock();

    const totalOrdered =
        getTotalOrdered();

    const freeStock =
        totalStock - totalOrdered;

    const accounts =
        getAccountsWithOrders();

    const supplierNeed =
        getSupplierNeed();


    let html = `


        <div class="section">

            <div class="section-title">
                Сегодня
            </div>


            <div class="dashboard">


                <div
                    class="metric"
                    onclick="showAllStock()">

                    <div class="metric-title">
                        Всего товара
                    </div>

                    <div class="metric-value">
                        ${totalStock}
                    </div>

                    <div class="metric-unit">
                        шт.
                    </div>

                </div>


                <div
                    class="metric"
                    onclick="showAllOrders()">

                    <div class="metric-title">
                        Заказано сегодня
                    </div>

                    <div class="metric-value">
                        ${totalOrdered}
                    </div>

                    <div class="metric-unit">
                        шт.
                    </div>

                </div>


                <div
                    class="metric"
                    onclick="showFreeStock()">

                    <div class="metric-title">
                        Свободный остаток
                    </div>

                    <div class="metric-value">
                        ${freeStock}
                    </div>

                    <div class="metric-unit">
                        шт.
                    </div>

                </div>


                <div
                    class="metric"
                    onclick="showAccountsWithOrders()">

                    <div class="metric-title">
                        Аккаунтов получили заказы
                    </div>

                    <div class="metric-value">
                        ${accounts}
                    </div>

                </div>


                <div
                    class="metric warning"
                    onclick="showSupplierNeed()">

                    <div class="metric-title">
                        Нужно поставить
                    </div>

                    <div class="metric-value">
                        ${supplierNeed}
                    </div>

                    <div class="metric-unit">
                        шт.
                    </div>

                </div>


            </div>

        </div>


        <div class="section">

            <div class="section-title">
                Склады
            </div>


    `;


    warehouses.forEach(
        warehouse => {

            html += `

                <div
                    class="card clickable"
                    onclick="showWarehouse(
                        ${warehouse.id}
                    )">

                    <div class="warehouse-row">

                        <div class="warehouse-name">

                            📍 ${warehouse.name}

                        </div>

                        <div>

                            ${totalStockForWarehouse(
                                warehouse.id
                            )}

                            шт.

                        </div>

                    </div>

                </div>

            `;

        }

    );


    html += `

        </div>


        <div class="section">

            <div class="section-title">
                Товары
            </div>

    `;


    if (
        products.length === 0
    ) {

        html += `

            <div class="card empty">

                Товаров пока нет.

            </div>

        `;

    }


    products.forEach(
        product => {

            html += `

                <div
                    class="card clickable"
                    onclick="showProduct(
                        ${product.id}
                    )">

                    <div class="product-name">

                        📦 ${product.name}

                    </div>

                    <div class="product-subtitle">

                        Нажмите для детализации

                    </div>

                </div>

            `;

        }

    );


    html += `

        </div>

    `;


    document.getElementById(
        "app"
    ).innerHTML = html;

}



function totalStockForWarehouse(
    warehouseId
) {

    /*
        Пока один общий остаток.
        Когда добавим распределение
        товара по складам, здесь
        появится настоящая логика.
    */

    return getTotalStock();

}



/* =========================================================
   ТОВАР
========================================================= */


function showProduct(productId) {

    const product =
        getProduct(productId);


    let html = `

        <button
            class="back-button"
            onclick="closeModal()">

            ← Назад

        </button>


        <h2>
            📦 ${product.name}
        </h2>


        <div class="small">

            Размеры и остатки

        </div>


        <br>


        <table>

            <tr>

                <th>
                    Размер
                </th>

                <th>
                    Остаток
                </th>

                <th>
                    Заказано
                </th>

                <th>
                    Свободно
                </th>

            </tr>

    `;


    product.sizes.forEach(
        size => {

            const ordered =
                getOrdered(
                    product.id,
                    size.size
                );


            const free =
                size.stock - ordered;


            html += `

                <tr>

                    <td>
                        ${size.size}
                    </td>


                    <td
                        class="link"
                        onclick="showSizeDetails(
                            ${product.id},
                            '${size.size}'
                        )">

                        ${size.stock}

                    </td>


                    <td
                        class="link"
                        onclick="showPlatforms(
                            ${product.id},
                            '${size.size}'
                        )">

                        ${ordered}

                    </td>


                    <td
                        class="link"
                        onclick="showFreeDetails(
                            ${product.id},
                            '${size.size}'
                        )">

                        ${free}

                    </td>

                </tr>

            `;

        }

    );


    html += `

        </table>

    `;


    /*
        Удаление только своего товара.
        В этом прототипе Товар 1 —
        товар производителя.
    */


    if (
        product.owner === "manufacturer"
    ) {

        html += `

            <br>


            <button
                class="danger-button"
                onclick="deleteProductAsk(
                    ${product.id}
                )">

                🗑 Удалить товар

            </button>

        `;

    }


    openModal(html);

}



/* =========================================================
   ДЕТАЛИЗАЦИЯ ОСТАТКА
========================================================= */


function showSizeDetails(
    productId,
    sizeName
) {

    const product =
        getProduct(productId);


    const size =
        product.sizes.find(
            item =>
                item.size === sizeName
        );


    const ordered =
        getOrdered(
            productId,
            sizeName
        );


    openModal(`

        <button
            class="back-button"
            onclick="showProduct(
                ${productId}
            )">

            ← Назад

        </button>


        <h2>
            ${product.name}
        </h2>


        <div class="card">

            <div class="small">
                Размер
            </div>

            <h2>
                ${sizeName}
            </h2>


            <div class="total">

                <span>
                    Остаток
                </span>

                <span>
                    ${size.stock} шт.
                </span>

            </div>


            <div
                class="total clickable"
                onclick="showPlatforms(
                    ${productId},
                    '${sizeName}'
                )">

                <span>
                    Заказано
                </span>

                <span class="link">
                    ${ordered} шт.
                </span>

            </div>


            <div class="total">

                <span>
                    Свободно
                </span>

                <span>
                    ${size.stock - ordered} шт.
                </span>

            </div>

        </div>

    `);

}



/* =========================================================
   ЗАКАЗАНО → ПЛАТФОРМЫ
========================================================= */


function showPlatforms(
    productId,
    sizeName
) {

    const filtered =
        orders.filter(

            order =>

                order.product === productId &&
                order.size === sizeName

        );


    let grouped = {};


    filtered.forEach(
        order => {

            if (
                !grouped[order.platform]
            ) {

                grouped[order.platform] = 0;

            }


            grouped[order.platform] +=
                order.quantity;

        }
    );


    let html = `

        <button
            class="back-button"
            onclick="showProduct(
                ${productId}
            )">

            ← Назад

        </button>


        <h2>
            Заказано
        </h2>


        <p class="small">

            Платформы

        </p>

    `;


    Object.keys(grouped)
        .forEach(
            platformId => {

                const platform =
                    getPlatform(
                        Number(platformId)
                    );


                html += `

                    <div
                        class="modal-row"
                        onclick="showPlatformAccounts(
