<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мой склад</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f5f7;
    font-family: Arial, sans-serif;
    color: #111;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin: 30px 0;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-size: 14px;
    color: #555;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 16px;
}

.role {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
    cursor: pointer;
}

.role.selected {
    border: 2px solid #111;
    background: #f5f5f5;
}

.role-title {
    font-size: 17px;
    font-weight: bold;
}

.role-description {
    margin-top: 5px;
    color: #777;
    font-size: 13px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 16px;
}

.error {
    color: #c00000;
    margin-top: 10px;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        📦 Мой склад
    </div>

    <div class="card">

        <h2>
            Создание аккаунта
        </h2>

        <p>
            Для начала работы заполните данные.
        </p>

        <label>
            Имя
        </label>

        <input
            id="name"
            type="text"
            placeholder="Введите имя">


        <label>
            Номер телефона
        </label>

        <input
            id="phone"
            type="tel"
            placeholder="+7 999 999-99-99">


        <h3>
            Кто вы?
        </h3>


        <div
            class="role"
            onclick="chooseRole('seller', this)">

            <div class="role-title">
                🛒 Селлер
            </div>

            <div class="role-description">
                Продаю товары производителей.
            </div>

        </div>


        <div
            class="role"
            onclick="chooseRole('manufacturer', this)">

            <div class="role-title">
                🏭 Производитель
            </div>

            <div class="role-description">
                Производю и размещаю свои товары.
            </div>

        </div>


        <div
            class="role"
            onclick="chooseRole('both', this)">

            <div class="role-title">
                🔄 Производитель + Селлер
            </div>

            <div class="role-description">
                Производю свои товары и продаю товары.
            </div>

        </div>


        <div
            id="error"
            class="error">
        </div>


        <button onclick="register()">
            Продолжить
        </button>

    </div>

</div>


<script>

let selectedRole = null;


function chooseRole(role, element) {

    selectedRole = role;

    document
        .querySelectorAll(".role")
        .forEach(item => {

            item.classList.remove("selected");

        });

    element.classList.add("selected");

}


function register() {

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const phone =
        document
        .getElementById("phone")
        .value
        .trim();

    const error =
        document.getElementById("error");


    if (!name) {

        error.innerText =
            "Введите имя.";

        return;

    }


    if (!phone) {

        error.innerText =
            "Введите номер телефона.";

        return;

    }


    if (!selectedRole) {

        error.innerText =
            "Выберите, кто вы.";

        return;

    }


    /*
       Пока просто показываем,
       что регистрация сработала.
    */

    let roleText = "";


    if (selectedRole === "seller") {

        roleText = "Селлер";

    }

    if (selectedRole === "manufacturer") {

        roleText = "Производитель";

    }

    if (selectedRole === "both") {

        roleText =
            "Производитель + Селлер";

    }


    document.querySelector(".container").innerHTML = `

        <div class="logo">
            📦 Мой склад
        </div>

        <div class="card">

            <h2>
                Добро пожаловать, ${name}!
            </h2>

            <p>
                Регистрация прошла успешно.
            </p>

            <p>
                Ваша роль:
                <b>${roleText}</b>
            </p>

            <button onclick="alert('Дальше подключим настоящий дашборд')">
                Перейти в Мой склад
            </button>

        </div>

    `;

}

</script>

</body>
</html>
