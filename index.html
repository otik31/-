<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мой склад</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f5f7;
    font-family: Arial, sans-serif;
    color: #111;
}

.header {
    background: #111;
    color: white;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 20;
}

.header h1 {
    margin: 0;
    font-size: 21px;
}

.menu-button {
    background: #333;
    color: white;
    border: 0;
    padding: 9px 12px;
    border-radius: 9px;
    font-size: 18px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.section {
    margin-bottom: 22px;
}

.section-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.metric {
    background: white;
    border-radius: 14px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
    cursor: pointer;
}

.metric:active {
    transform: scale(.98);
}

.metric-label {
    color: #777;
    font-size: 13px;
}

.metric-value {
    font-size: 26px;
    font-weight: bold;
    margin-top: 7px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 10px;
}

.clickable {
    cursor: pointer;
}

.clickable:active {
    transform: scale(.99);
}

.warehouse {
    display: flex;
    justify-content: space-between;
}

.warehouse-name {
    font-weight: bold;
}

.product-title {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 12px;
}

.product-subtitle {
    color: #777;
    font-size: 13px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    color: #777;
    font-size: 12px;
    text-align: left;
    padding: 7px 4px;
}

td {
    padding: 10px 4px;
    border-top: 1px solid #eee;
}

.number {
    font-weight: bold;
}

.order-link,
.detail-link {
    color: #1266ff;
    font-weight: bold;
    text-decoration: underline;
    cursor: pointer;
}

.total {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid #eee;
    margin-top: 12px;
    padding-top: 12px;
    font-weight: bold;
}

.add-button {
    width: 100%;
    background: white;
    border: 2px dashed #ccc;
    padding: 13px;
    border-radius: 11px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 100;
    padding: 15px;
}

.modal-box {
    background: white;
    max-width: 500px;
    margin: 25px auto;
    border-radius: 16px;
    padding: 20px;
    max-height: 88vh;
    overflow-y: auto;
}

.close {
    float: right;
    font-size: 25px;
    cursor: pointer;
}

.modal-item {
    padding: 14px 5px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
}

.modal-item:last-child {
    border-bottom: 0;
}

.modal-item:hover {
    background: #f5f5f5;
}

.back {
    background: #eee;
    border: 0;
    padding: 9px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
}

input,
select {
    width: 100%;
    padding: 11px;
    margin: 6px 0 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.save {
    width: 100%;
    background: #111;
    color: white;
    border: 0;
    padding: 12px;
    border-radius: 9px;
}

.secondary {
    width: 100%;
    background: #eee;
    color: #111;
    border: 0;
    padding: 12px;
    border-radius: 9px;
    margin-top: 8px;
}

.delete {
    background: #ffe5e5;
    color: #b00000;
    border: 0;
    padding: 8px 11px;
    border-radius: 8px;
    cursor: pointer;
}

.menu-section {
    margin-top: 20px;
}

.menu-section h3 {
    margin-bottom: 8px;
}

.menu-row {
    padding: 13px 5px;
    border-bottom: 1px solid #eee;
}

.plus {
    color: #1266ff;
    font-weight: bold;
    cursor: pointer;
}

.platform {
    font-weight: bold;
}

.account {
    padding-left: 15px;
    color: #555;
    margin-top: 7px;
}

.badge {
    display: inline-block;
    background: #eee;
    border-radius: 20px;
    padding: 5px 9px;
    font-size: 12px;
}

.warning {
    background: #fff7d6;
    border-radius: 10px;
    padding: 12px;
    margin: 10px 0;
}

.success {
    background: #e9f7ec;
    border-radius: 10px;
    padding: 12px;
    margin: 10px 0;
}

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

.small {
    color: #777;
    font-size: 13px;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

</style>
</head>

<body>


<div class="header">

    <h1>📦 Мой склад</h1>

    <button
        class="menu-button"
        onclick="openMenu()">

        ☰

    </button>

</div>


<div
    class="container"
    id="app">

</div>


<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <span
            class="close"
            onclick="closeModal()">

            ×

        </span>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* =====================================================
   ДАННЫЕ
===================================================== */

const defaultData = {

    warehouses: [

        {
            id: 1,
            name: "Белгород"
        },

        {
            id: 2,
            name: "Москва"
        }

    ],

    platforms: [

        {
            id: 1,
            name: "Wildberries",

            accounts: [

                {
                    id: 1,
                    name: "Аккаунт №1"
                },

                {
                    id: 2,
                    name: "Аккаунт №2"
                }

            ]

        },

        {
            id: 2,
            name: "Ozon",

            accounts: [

                {
                    id: 3,
                    name: "Аккаунт №1"
                }

            ]

        }

    ],

    products: [

        {
            id: 1,

            name: "Товар 1",

            owner: "manufacturer",

            warehouse: 1,

            sizes: [

                {
                    size: "1",
                    stock: 20
                },

                {
                    size: "2",
                    stock: 35
                },

                {
                    size: "3",
                    stock: 42
                },

                {
                    size: "4",
                    stock: 18
                },

                {
                    size: "5",
                    stock: 7
                }

            ]

        },

        {
            id: 2,

            name: "Товар 2",

            owner: "manufacturer",

            warehouse: 2,

            sizes: [

                {
                    size: "1",
                    stock: 50
                },

                {
                    size: "2",
                    stock: 80
                },

                {
                    size: "3",
                    stock: 70
                },

                {
                    size: "4",
                    stock: 45
                },

                {
                    size: "5",
                    stock: 20
                }

            ]

        }

    ],

    orders: [

        {
            id: "WB-10001",
            platform: 1,
            account: 1,
            product: 1,
            size: "1",
            quantity: 3
        },

        {
            id: "WB-10002",
            platform: 1,
            account: 2,
            product: 1,
            size: "2",
            quantity: 7
        },

        {
            id: "WB-10003",
            platform: 1,
            account: 1,
            product: 1,
            size: "3",
            quantity: 5
        },

        {
            id: "OZ-20001",
            platform: 2,
            account: 3,
            product: 1,
            size: "3",
            quantity: 7
        },

        {
            id: "WB-10004",
            platform: 1,
            account: 2,
            product: 1,
            size: "4",
            quantity: 2
        },

        {
            id: "WB-10005",
            platform: 1,
            account: 1,
            product: 1,
            size: "5",
            quantity: 1
        }

    ],

    supplierOrders: [

        {
            product: 1,
            size: "3",
            quantity: 12
        }

    ]

};


/* =====================================================
   LOCAL STORAGE
===================================================== */

let data =
    JSON.parse(
        localStorage.getItem("moySkladData")
    );


if (!data) {

    data =
        JSON.parse(
            JSON.stringify(defaultData)
        );

    saveData();

}


function saveData() {

    localStorage.setItem(
        "moySkladData",
        JSON.stringify(data)
    );

}


/* =====================================================
   ПОИСК
===================================================== */

function product(id) {

    return data.products.find(
        x => x.id === id
    );

}


function platform(id) {

    return data.platforms.find(
        x => x.id === id
    );

}


function account(id) {

    for (
        const p of data.platforms
    ) {

        const a =
            p.accounts.find(
                x => x.id === id
            );

        if (a) return a;

    }

    return null;

}


function warehouse(id) {

    return data.warehouses.find(
        x => x.id === id
    );

}


/* =====================================================
   СТАТИСТИКА
===================================================== */

function totalStock() {

    return data.products.reduce(

        (sum, p) =>

            sum +

            p.sizes.reduce(
                (s, x) =>
                    s + Number(x.stock),

                0
            ),

        0

    );

}


function totalOrders() {

    return data.orders.reduce(
        (sum, x) =>
            sum + Number(x.quantity),

        0
    );

}


function activeAccounts() {

    return new Set(
        data.orders.map(
            x => x.account
        )
    ).size;

}


function orderedForProductSize(
    productId,
    size
) {

    return data.orders

        .filter(
            x =>
                x.product === productId &&
                x.size === size
        )

        .reduce(
            (sum, x) =>
                sum + Number(x.quantity),

            0
        );

}


function supplierNeed() {

    return data.supplierOrders.reduce(
        (sum, x) =>
            sum + Number(x.quantity),

        0
    );

}


/* =====================================================
   ГЛАВНАЯ
===================================================== */

function render() {

    const stock =
        totalStock();

    const orders =
        totalOrders();

    const free =
        stock - orders;

    const accounts =
        activeAccounts();

    const need =
        supplierNeed();


    let html = `

        <div class="section">

            <div class="section-title">
                Сегодня
            </div>


            <div class="dashboard">


                <div
                    class="metric"
                    onclick="showTotalStock()">

                    <div class="metric-label">
                        Всего товара
                    </div>

                    <div class="metric-value">
                        ${stock}
                    </div>

                    <div class="metric-label">
                        шт.
                    </div>

                </div>


                <div
                    class="metric"
                    onclick="showTotalOrders()">

                    <div class="metric-label">
                        Заказано сегодня
                    </div>

                    <div class="metric-value">
                        ${orders}
                    </div>

                    <div class="metric-label">
                        шт.
                    </div>

                </div>


                <div
                    class="metric"
                    onclick="showFreeStock()">

                    <div class="metric-label">
                        Свободно
                    </div>

                    <div class="metric-value">
                        ${free}
                    </div>

                    <div class="metric-label">
                        шт.
                    </div>

                </div>


                <div
                    class="metric"
                    onclick="showActiveAccounts()">

                    <div class="metric-label">
                        Аккаунтов получили заказы
                    </div>

                    <div class="metric-value">
                        ${accounts}
                    </div>

                </div>


                <div
                    class="metric"
                    onclick="showSupplierNeed()">

                    <div class="metric-label">
                        Нужно поставить
                    </div>

                    <div class="metric-value">
                        ${need}
                    </div>

                    <div class="metric-label">
                        шт.
                    </div>

                </div>


            </div>

        </div>


        <div class="section">

            <div class="section-title">
                Склады
            </div>

    `;


    data.warehouses.forEach(
        w => {

            const stockInWarehouse =
                data.products

                    .filter(
                        p =>
                            p.warehouse === w.id
                    )

                    .reduce(

                        (sum, p) =>

                            sum +

                            p.sizes.reduce(
                                (s, x) =>
                                    s + Number(x.stock),

                                0
                            ),

                        0
                    );


            html += `

                <div
                    class="card warehouse clickable"
                    onclick="showWarehouse(
                        ${w.id}
                    )">

                    <div class="warehouse-name">

                        📍 ${w.name}

                    </div>

                    <div>

                        ${stockInWarehouse} шт.

                    </div>

                </div>

            `;

        }

    );


    html += `

        </div>


        <div class="section">

            <div class="section-title">
                Товары
            </div>

    `;


    if (
        data.products.length === 0
    ) {

        html += `

            <div class="card empty">

                Товаров пока нет.

            </div>

        `;

    }


    data.products.forEach(
        p => {

            const w =
                warehouse(
                    p.warehouse
                );


            html += `

                <div class="card">

                    <div class="product-title">

                        📦 ${p.name}

                    </div>

                    <div class="product-subtitle">

                        📍 ${
                            w
                                ? w.name
                                : "Склад не указан"
                        }

                    </div>


                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Размер
                                </th>

                                <th>
                                    Остаток
                                </th>

                                <th>
                                    Заказано
                                </th>

                                <th>
                                    Свободно
                                </th>

                            </tr>

                        </thead>


                        <tbody>

            `;


            p.sizes.forEach(
                s => {

                    const ordered =
                        orderedForProductSize(
                            p.id,
                            s.size
                        );


                    const free =
                        Number(s.stock) -
                        ordered;


                    html += `

                        <tr>

                            <td>
                                ${s.size}
                            </td>

                            <td
                                class="number detail-link"
                                onclick="showSizeDetails(
                                    ${p.id},
                                    '${s.size}'
                                )">

                                ${s.stock}

                            </td>


                            <td>

                                <span
                                    class="order-link"
                                    onclick="showPlatforms(
                                        ${p.id},
                                        '${s.size}'
                                    )">

                                    ${ordered}

                                </span>

                            </td>


                            <td
                                class="detail-link"
                                onclick="showFreeDetails(
                                    ${p.id},
                                    '${s.size}'
                                )">

                                ${free}

                            </td>

                        </tr>

                    `;

                }

            );


            const productTotal =
                p.sizes.reduce(
                    (sum, s) =>
                        sum + Number(s.stock),

                    0
                );


            html += `

                        </tbody>

                    </table>


                    <div class="total">

                        <span>
                            Всего
                        </span>

                        <span>
                            ${productTotal} шт.
                        </span>

                    </div>

                </div>

            `;

        }

    );


    html += `

        </div>

    `;


    document.getElementById(
        "app"
    ).innerHTML = html;

}


/* =====================================================
   ДАШБОРД — ДЕТАЛИ
===================================================== */

function showTotalStock() {

    let html = `

        <h2>
            📦 Все остатки
        </h2>

    `;


    data.products.forEach(
        p => {

            html += `

                <div class="modal-item">

                    <b>
                        ${p.name}
                    </b>

            `;


            p.sizes.forEach(
                s => {

                    html += `

                        <div class="stat-row">

                            <span>
                                Размер ${s.size}
                            </span>

                            <b>
                                ${s.stock} шт.
                            </b>

                        </div>

                    `;

                }

            );


            html += `

                </div>

            `;

        }

    );


    openModal(html);

}


function showTotalOrders() {

    let html = `

        <h2>
            📦 Заказано сегодня
        </h2>

    `;


    data.orders.forEach(
        o => {

            const p =
                product(o.product);

            const pl =
                platform(o.platform);

            const a =
                account(o.account);


            html += `

                <div class="modal-item">

                    <b>
                        ${o.id}
                    </b>

                    <br>

                    ${p ? p.name : ""}

                    · размер ${o.size}

                    · <b>
                        ${o.quantity} шт.
                    </b>

                    <br>

                    <span class="small">

                        ${
                            pl
                                ? pl.name
                                : ""
                        }

                        →

                        ${
                            a
                                ? a.name
                                : ""
                        }

                    </span>

                </div>

            `;

        }

    );


    openModal(html);

}


function showFreeStock() {

    let html = `

        <h2>
            Свободный остаток
        </h2>

    `;


    data.products.forEach(
        p => {

            p.sizes.forEach(
                s => {

                    const ordered =
                        orderedForProductSize(
                            p.id,
                            s.size
                        );


                    html += `

                        <div class="stat-row">

                            <span>

                                ${p.name}

                                · размер ${s.size}

                            </span>

                            <b>

                                ${
                                    Number(s.stock) -
                                    ordered
                                }
                                шт.

                            </b>

                        </div>

                    `;

                }

            );

        }

    );


    openModal(html);

}


function showActiveAccounts() {

    let html = `

        <h2>
            👤 Аккаунты с заказами
        </h2>

    `;


    data.platforms.forEach(
        pl => {

            pl.accounts.forEach(
                a => {

                    const quantity =
                        data.orders

                            .filter(
                                o =>
                                    o.account === a.id
                            )

                            .reduce(
                                (sum, o) =>
                                    sum +
                                    Number(o.quantity),

                                0
                            );


                    if (
                        quantity > 0
                    ) {

                        html += `

                            <div class="modal-item">

                                👤

                                <b>
                                    ${a.name}
                                </b>

                                <br>

                                ${pl.name}

                                <br>

                                Заказано:

                                <b>
                                    ${quantity} шт.
                                </b>

                            </div>

                        `;

                    }

                }

            );

        }

    );


    openModal(html);

}


function showSupplierNeed() {

    let html = `

        <h2>
            ⚠️ Нужно поставить
        </h2>

        <p class="small">

            Производитель обязан предоставить
            товары, которые были заказаны.

        </p>

    `;


    data.supplierOrders.forEach(
        item => {

            const p =
                product(item.product);


            if (!p) return;


            html += `

                <div class="modal-item">

                    <b>
                        ${p.name}
                    </b>

                    <br>

                    Размер:
                    ${item.size}

                    <br>

                    Нужно поставить:

                    <b>
                        ${item.quantity} шт.
                    </b>

                </div>

            `;

        }

    );


    openModal(html);

}


/* =====================================================
   РАЗМЕР
===================================================== */

function showSizeDetails(
    productId,
    size
) {

    const p =
        product(productId);


    const s =
        p.sizes.find(
            x =>
                x.size === size
        );


    const ordered =
        orderedForProductSize(
            productId,
            size
        );


    openModal(`

        <button
            class="back"
            onclick="closeModal()">

            ← Назад

        </button>


        <h2>
            ${p.name}
        </h2>


        <p>
            Размер:
            <b>${size}</b>
        </p>


        <div class="stat-row">

            <span>
                Остаток
            </span>

            <b>
                ${s.stock} шт.
            </b>

        </div>


        <div
            class="stat-row clickable"
            onclick="showPlatforms(
                ${productId},
                '${size}'
            )">

            <span>
                Заказано
            </span>

            <b class="detail-link">
                ${ordered} шт.
            </b>

        </div>


        <div class="stat-row">

            <span>
                Свободно
            </span>

            <b>
                ${Number(s.stock) - ordered} шт.
            </b>

        </div>

    `);

}


function showFreeDetails(
    productId,
    size
) {

    const p =
        product(productId);


    const s =
        p.sizes.find(
            x =>
                x.size === size
        );


    const ordered =
        orderedForProductSize(
            productId,
            size
        );


    openModal(`

        <h2>
            Свободный остаток
        </h2>

        <p>
            ${p.name}
            · размер ${size}
        </p>


        <div class="stat-row">

            <span>
                Остаток
            </span>

            <b>
                ${s.stock} шт.
            </b>

        </div>


        <div class="stat-row">

            <span>
                Заказано
            </span>

            <b>
                ${ordered} шт.
            </b>

        </div>


        <div class="stat-row">

            <span>
                Свободно
            </span>

            <b>
                ${Number(s.stock) - ordered} шт.
            </b>

        </div>

    `);

}


/* =====================================================
   ЗАКАЗАНО → ПЛАТФОРМЫ
===================================================== */

function showPlatforms(
    productId,
    size
) {

    const filtered =
        data.orders.filter(
            o =>
                o.product === productId &&
                o.size === size
        );


    const groups = {};


    filtered.forEach(
        o => {

            if (
                !groups[o.platform]
            ) {

                groups[o.platform] = 0;

            }


            groups[o.platform] +=
                Number(o.quantity);

        }

    );


    let html = `

        <button
            class="back"
            onclick="showSizeDetails(
                ${productId},
                '${size}'
            )">

            ← Назад

        </button>


        <h2>
            🛒 Платформы
        </h2>


        <p>
            ${product(productId).name}
            · размер ${size}
        </p>

    `;


    Object.keys(groups).forEach(
        platformId => {

            const pl =
                platform(
                    Number(platformId)
                );


            html += `

                <div
                    class="modal-item"
                    onclick="showAccounts(
                        ${platformId},
                        ${productId},
                        '${size}'
                    )">

                    <div class="platform">

                        🛒
                        ${pl.name}

                    </div>

                    <div>

                        Заказано:

                        <b>
                            ${groups[platformId]} шт.
                        </b>

                    </div>

                </div>

            `;

        }

    );


    if (
        Object.keys(groups).length === 0
    ) {

        html += `

            <div class="empty">

                Заказов нет.

            </div>

        `;

    }


    openModal(html);

}


/* =====================================================
   ПЛАТФОРМА → АККАУНТЫ
===================================================== */

function showAccounts(
    platformId,
    productId,
    size
) {

    const pl =
        platform(
            Number(platformId)
        );


    let html = `

        <button
            class="back"
            onclick="showPlatforms(
                ${productId},
                '${size}'
            )">

            ← Назад

        </button>


        <h2>
            🛒 ${pl.name}
        </h2>


        <p>
            Размер:
            <b>${size}</b>
        </p>

    `;


    pl.accounts.forEach(
        a => {

            const quantity =
                data.orders

                    .filter(
                        o =>
                            o.account === a.id &&
                            o.product === productId &&
                            o.size === size
                    )

                    .reduce(
                        (sum, o) =>
                            sum +
                            Number(o.quantity),

                        0
                    );


            if (
                quantity > 0
            ) {

                html += `

                    <div
                        class="modal-item"
                        onclick="showOrders(
                            ${platformId},
                            ${a.id},
                            ${productId},
                            '${size}'
                        )">

                        👤

                        <b>
                            ${a.name}
                        </b>

                        <br>

                        Заказано:

                        <b>
                            ${quantity} шт.
                        </b>

                    </div>

                `;

            }

        }

    );


    openModal(html);

}


/* =====================================================
   АККАУНТ → ЗАКАЗЫ
===================================================== */

function showOrders(
    platformId,
    accountId,
    productId,
    size
) {

    const pl =
        platform(
            Number(platformId)
        );


    const a =
        account(
            Number(accountId)
        );


    const orders =
        data.orders.filter(
            o =>
                o.platform === Number(platformId) &&
                o.account === Number(accountId) &&
                o.product === productId &&
                o.size === size
        );


    let html = `

        <button
            class="back"
            onclick="showAccounts(
                ${platformId},
                ${productId},
                '${size}'
            )">

            ← Назад

        </button>


        <h2>
            👤 ${a.name}
        </h2>


        <p>
            Платформа:
            <b>${pl.name}</b>
        </p>


        <p>
            Размер:
            <b>${size}</b>
        </p>


        <h3>
            Заказы сегодня
        </h3>

    `;


    orders.forEach(
        o => {

            html += `

                <div class="modal-item">

                    <b>
                        ${o.id}
                    </b>

                    <br>

                    ${product(o.product).name}

                    · размер ${o.size}

                    · ${o.quantity} шт.

                </div>

            `;

        }

    );


    openModal(html);

}


/* =====================================================
   СКЛАД
===================================================== */

function showWarehouse(
    warehouseId
) {

    const w =
        warehouse(
            warehouseId
        );


    let html = `

        <h2>
            📍 ${w.name}
        </h2>

        <p class="small">
            Товары на складе
        </p>

    `;


    data.products

        .filter(
            p =>
                p.warehouse === warehouseId
        )

        .forEach(
            p => {

                const total =
                    p.sizes.reduce(
                        (sum, s) =>
                            sum +
                            Number(s.stock),

                        0
                    );


                html += `

                    <div class="modal-item">

                        📦

                        <b>
                            ${p.name}
                        </b>

                        <br>

                        Остаток:
                        <b>
                            ${total} шт.
                        </b>

                    </div>

                `;

            }

        );


    openModal(html);

}


/* =====================================================
   МЕНЮ
===================================================== */

function openMenu() {

    let html = `

        <h2>
            ☰ Управление
        </h2>


        <div class="menu-section">

            <h3>
                🏢 Склады
            </h3>

    `;


    data.warehouses.forEach(
        w => {

            html += `

                <div class="menu-row">

                    <div
                        style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        ">

                        <span>
                            📍 ${w.name}
                        </span>

                        <button
                            class="delete"
                            onclick="deleteWarehouseAsk(
                                ${w.id}
                            )">

                            Удалить

                        </button>

                    </div>

                </div>

            `;

        }

    );


    html += `

            <div
                class="menu-row plus"
                onclick="addWarehouse()">

                ＋ Добавить склад

            </div>

        </div>


        <div class="menu-section">

            <h3>
                🛒 Платформы
            </h3>

    `;


    data.platforms.forEach(
        p => {

            html += `

                <div class="menu-row platform">

                    🛒 ${p.name}

                </div>

            `;

        }

    );


    html += `

            <div
                class="menu-row plus"
                onclick="addPlatform()">

                ＋ Добавить платформу

            </div>

        </div>


        <div class="menu-section">

            <h3>
                👤 Аккаунты
            </h3>

    `;


    data.platforms.forEach(
        (p, index) => {

            html += `

                <div class="menu-row">

                    <div class="platform">
                        ${p.name}
                    </div>

            `;


            p.accounts.forEach(
                a => {

                    html += `

                        <div
                            class="account"
                            style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                            ">

                            <span>
                                └ ${a.name}
                            </span>

                            <button
                                class="delete"
                                onclick="deleteAccountAsk(
                                    ${a.id}
                                )">

                                Удалить

                            </button>

                        </div>

                    `;

                }

            );


            html += `

                    <div
                        class="account plus"
                        onclick="addAccount(
                            ${p.id}
                        )">

                        ＋ Добавить аккаунт

                    </div>

                </div>

            `;

        }

    );


    html += `

        </div>


        <div class="menu-section">

            <h3>
                📦 Товары
            </h3>


            <div
                class="menu-row plus"
                onclick="addProduct()">

                ＋ Добавить товар

            </div>

    `;


    data.products.forEach(
        p => {

            html += `

                <div class="menu-row">

                    <div
                        style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        ">

                        <span>
                            📦 ${p.name}
                        </span>

                        <button
                            class="delete"
                            onclick="deleteProductAsk(
                                ${p.id}
                            )">

                            Удалить

                        </button>

                    </div>

                </div>

            `;

        }

    );


    html += `

        </div>

    `;


    openModal(html);

}


/* =====================================================
   ДОБАВЛЕНИЕ
===================================================== */

function addWarehouse() {

    openModal(`

        <h2>
            ＋ Добавить склад
        </h2>


        <label>
            Город / название
        </label>


        <input
            id="warehouseName"
            placeholder="Например: Воронеж">


        <button
            class="save"
            onclick="saveWarehouse()">

            Добавить

        </button>

    `);

}


function saveWarehouse() {

    const name =
        document
            .getElementById(
                "warehouseName"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Введите название."
        );

        return;

    }


    data.warehouses.push({

        id: Date.now(),

        name: name

    });


    saveData();

    closeModal();

    render();

}


function addPlatform() {

    openModal(`

        <h2>
            ＋ Добавить платформу
        </h2>


        <label>
            Название платформы
        </label>


        <input
            id="platformName"
            placeholder="Например: Яндекс Маркет">


        <button
            class="save"
            onclick="savePlatform()">

            Добавить

        </button>

    `);

}


function savePlatform() {

    const name =
        document
            .getElementById(
                "platformName"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Введите название."
        );

        return;

    }


    data.platforms.push({

        id: Date.now(),

        name: name,

        accounts: []

    });


    saveData();

    closeModal();

    render();

}


function addAccount(
    platformId
) {

    const p =
        platform(
            platformId
        );


    openModal(`

        <h2>
            ＋ Добавить аккаунт
        </h2>


        <p class="small">

            Платформа:
            <b>
                ${p.name}
            </b>

        </p>


        <label>
            Название аккаунта
        </label>


        <input
            id="accountName"
            placeholder="Например: Основной">


        <button
            class="save"
            onclick="saveAccount(
                ${platformId}
            )">

            Добавить

        </button>

    `);

}


function saveAccount(
    platformId
) {

    const name =
        document
            .getElementById(
                "accountName"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Введите название."
        );

        return;

    }


    const p =
        platform(
            platformId
        );


    p.accounts.push({

        id: Date.now(),

        name: name

    });


    saveData();

    closeModal();

    render();

}


function addProduct() {

    let warehouseOptions = "";


    data.warehouses.forEach(
        w => {

            warehouseOptions += `

                <option value="${w.id}">

                    ${w.name}

                </option>

            `;

        }
    );


    openModal(`

        <h2>
            ＋ Добавить товар
        </h2>


        <label>
            Название товара
        </label>


        <input
            id="productName"
            placeholder="Например: Футболка">


        <label>
            Склад
        </label>


        <select id="productWarehouse">

            ${warehouseOptions}

        </select>


        <label>
            Размеры через запятую
        </label>


        <input
            id="productSizes"
            placeholder="1,2,3,4,5">


        <label>
            Остатки через запятую
        </label>


        <input
            id="productStocks"
            placeholder="20,35,42,18,7">


        <button
            class="save"
            onclick="saveProduct()">

            Добавить товар

        </button>

    `);

}


function saveProduct() {

    const name =
        document
            .getElementById(
                "productName"
            )
            .value
            .trim();


    const warehouseId =
        Number(
            document
                .getElementById(
                    "productWarehouse"
                )
                .value
        );


    const sizes =
        document
            .getElementById(
                "productSizes"
            )
            .value
            .split(",")
            .map(
                x =>
                    x.trim()
            );


    const stocks =
        document
            .getElementById(
                "productStocks"
            )
            .value
            .split(",")
            .map(
                x =>
                    Number(x.trim())
            );


    if (!name) {

        alert(
            "Введите название товара."
        );

        return;

    }


    if (
        sizes.length !==
        stocks.length
    ) {

        alert(
            "Количество размеров и остатков должно совпадать."
        );

        return;

    }


    data.products.push({

        id: Date.now(),

        name: name,

        owner: "manufacturer",

        warehouse: warehouseId,

        sizes:

            sizes.map(
                (size, index) => ({

                    size: size,

                    stock:
                        stocks[index] || 0

                })

            )

    });


    saveData();

    closeModal();

    render();

}


/* =====================================================
   УДАЛЕНИЕ
===================================================== */

function deleteProductAsk(
    productId
) {

    const p =
        product(productId);


    const obligation =
        data.supplierOrders

            .filter(
                x =>
                    x.product === productId
            )

            .reduce(
                (sum, x) =>
                    sum +
                    Number(x.quantity),

                0
            );


    if (
        obligation > 0
    ) {

        openModal(`

            <h2>
                ⚠️ Удаление невозможно
            </h2>


            <div class="warning">

                У товара

                <b>
                    ${p.name}
                </b>

                есть незакрытое обязательство.

                <br><br>

                Производитель обязан предоставить:

                <b>
                    ${obligation} шт.
                </b>

            </div>


            <button
                class="secondary"
                onclick="closeModal()">

                Понятно

            </button>

        `);

        return;

    }


    confirmDeletion(
        "товар",
        p.name,
        () =>
            finalDeleteProduct(
                productId
            )
    );

}


function deleteWarehouseAsk(
    warehouseId
) {

    const w =
        warehouse(
            warehouseId
        );


    confirmDeletion(
        "склад",
        w.name,
        () =>
            finalDeleteWarehouse(
                warehouseId
            )
    );

}


function deleteAccountAsk(
    accountId
) {

    const a =
        account(
            accountId
        );


    confirmDeletion(
        "аккаунт",
        a.name,
        () =>
            finalDeleteAccount(
                accountId
            )
    );

}


function confirmDeletion(
    type,
    name,
    callback
) {

    window.pendingDelete =
        callback;


    openModal(`

        <h2>
            Удаление ${type}
        </h2>


        <p>

            Вы действительно хотите удалить:

        </p>


        <p>
            <b>
                ${name}
            </b>
        </p>


        <p class="small">

            После подтверждения действие
            нельзя будет отменить.

        </p>


        <button
            class="save"
            onclick="showDeleteConfirmation()">

            Да, продолжить

        </button>


        <button
            class="secondary"
            onclick="closeModal()">

            Отмена

        </button>

    `);

}


function showDeleteConfirmation() {

    openModal(`

        <h2>
            ⚠️ Последнее подтверждение
        </h2>


        <p>

            Чтобы окончательно удалить объект,
            введите слово:

        </p>


        <p>

            <b>
                УДАЛИТЬ
            </b>

        </p>


        <input
            id="deleteWord"
            placeholder="Введите УДАЛИТЬ">


        <button
            class="save"
            onclick="finishDelete()">

            Удалить окончательно

        </button>

    `);

}


function finishDelete() {

    const word =
        document
            .getElementById(
                "deleteWord"
            )
            .value
            .trim();


    if (
        word !== "УДАЛИТЬ"
    ) {

        alert(
            "Введите слово УДАЛИТЬ."
        );

        return;

    }


    if (
        typeof window.pendingDelete ===
        "function"
    ) {

        window.pendingDelete();

    }

}


function finalDeleteProduct(
    productId
) {

    data.products =
        data.products.filter(
            p =>
                p.id !== productId
        );


    data.orders =
        data.orders.filter(
            o =>
                o.product !== productId
        );


    data.supplierOrders =
        data.supplierOrders.filter(
            o =>
                o.product !== productId
        );


    saveData();

    closeModal();

    render();

}


function finalDeleteWarehouse(
    warehouseId
) {

    const hasProducts =
        data.products.some(
            p =>
                p.warehouse === warehouseId
        );


    if (
        hasProducts
    ) {

        alert(
            "Нельзя удалить склад, пока на нём есть товары."
        );

        return;

    }


    data.warehouses =
        data.warehouses.filter(
            w =>
                w.id !== warehouseId
        );


    saveData();

    closeModal();

    render();

}


function finalDeleteAccount(
    accountId
) {

    data.platforms.forEach(
        p => {

            p.accounts =
                p.accounts.filter(
                    a =>
                        a.id !== accountId
                );

        }
    );


    data.orders =
        data.orders.filter(
            o =>
                o.account !== accountId
        );


    saveData();

    closeModal();

    render();

}


/* =====================================================
   ОКНО
===================================================== */

function openModal(
    html
) {

    document.getElementById(
        "modalContent"
    ).innerHTML = html;


    document.getElementById(
        "modal"
    ).style.display = "block";

}


function closeModal() {

    document.getElementById(
        "modal"
    ).style.display = "none";

}


/* =====================================================
   ЗАПУСК
===================================================== */

render();

</script>

</body>
</html>
