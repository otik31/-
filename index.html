<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мой склад</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f5f7;
    font-family: Arial, sans-serif;
    color: #111;
}

.header {
    background: #111;
    color: white;
    padding: 18px;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.big {
    font-size: 30px;
    font-weight: bold;
    margin-top: 8px;
}

.label {
    color: #777;
    font-size: 14px;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

.sell {
    background: #111;
    color: white;
}

.add {
    background: #e8e8e8;
}

h2 {
    font-size: 18px;
    margin-top: 25px;
}

.operation {
    background: white;
    padding: 13px;
    border-radius: 10px;
    margin-top: 8px;
}

.empty {
    color: #888;
    text-align: center;
    padding: 20px;
}

</style>
</head>

<body>

<div class="header">
    <h1>📦 Мой склад</h1>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <div class="label">Остаток</div>
            <div class="big" id="stock">10</div>
            <div class="label">шт.</div>
        </div>

        <div class="card">
            <div class="label">Товаров</div>
            <div class="big">1</div>
        </div>

        <div class="card">
            <div class="label">Продаж</div>
            <div class="big" id="sales">0</div>
            <div class="label">сегодня</div>
        </div>

        <div class="card">
            <div class="label">Операций</div>
            <div class="big" id="operations">0</div>
        </div>

    </div>


    <h2>Площадки</h2>

    <div class="cards">

        <div class="card">
            <div class="label">Wildberries</div>
            <div class="big" id="wb">0</div>
            <div class="label">продаж</div>
        </div>

        <div class="card">
            <div class="label">Ozon</div>
            <div class="big" id="ozon">0</div>
            <div class="label">продаж</div>
        </div>

    </div>


    <h2>Быстрые действия</h2>

    <div class="buttons">

        <button class="sell" onclick="sell()">
            − Продажа
        </button>

        <button class="add" onclick="addStock()">
            + Приход
        </button>

    </div>


    <h2>Последние операции</h2>

    <div id="history">

        <div class="empty">
            Пока операций нет
        </div>

    </div>

</div>


<script>

let stock = 10;
let sales = 0;
let operations = 0;
let wb = 0;
let ozon = 0;


function sell() {

    if (stock <= 0) {

        alert("Товар закончился");

        return;
    }


    let platform = prompt(
        "Где была продажа?\n\n1 — Wildberries\n2 — Ozon"
    );


    if (platform !== "1" && platform !== "2") {

        return;
    }


    stock--;

    sales++;

    operations++;


    if (platform === "1") {

        wb++;

        addOperation("Продажа", "Wildberries");

    } else {

        ozon++;

        addOperation("Продажа", "Ozon");

    }


    updateDashboard();

}


function addStock() {

    let quantity = prompt("Сколько товара добавить?");

    quantity = Number(quantity);


    if (!quantity || quantity <= 0) {

        return;
    }


    stock += quantity;

    operations++;


    addOperation(
        "Приход",
        "+" + quantity + " шт."
    );


    updateDashboard();

}


function addOperation(type, info) {

    let history =
        document.getElementById("history");


    let empty =
        history.querySelector(".empty");


    if (empty) {

        empty.remove();

    }


    let operation =
        document.createElement("div");


    operation.className = "operation";


    operation.innerHTML =

        "<b>" + type + "</b><br>" +

        "<span class='label'>" +

        info +

        "</span>";


    history.prepend(operation);

}


function updateDashboard() {

    document.getElementById("stock").innerText =
        stock;


    document.getElementById("sales").innerText =
        sales;


    document.getElementById("operations").innerText =
        operations;


    document.getElementById("wb").innerText =
        wb;


    document.getElementById("ozon").innerText =
        ozon;

}

</script>

</body>
</html>
